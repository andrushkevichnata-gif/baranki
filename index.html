<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ландшафтный проект «Ветер»</title>
<style>
  html, body{ margin:0; padding:0; background:transparent; font-family:Arial, sans-serif; }
  #vbook-wrap{ max-width:1400px; margin:0 auto; padding:15px 10px; box-sizing:border-box; }
  #vbook-wrap:fullscreen{
    max-width:none; width:100vw; height:100vh; background:#f3f1ec;
    display:flex; flex-direction:column; justify-content:center; padding:20px;
  }
  #vbook{ margin:0 auto; }
  .vbook-page{ background:#f4f4f2; overflow:hidden; }
  .vbook-page canvas{ width:100%; height:100%; display:block; }
  #vbook-loader{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:80px 0; color:#555; font-size:16px; text-align:center;
  }
  .vbook-spinner{
    width:42px; height:42px; border:3px solid #ddd; border-top-color:#7a8b6f;
    border-radius:50%; animation:vbookspin 1s linear infinite;
  }
  @keyframes vbookspin{ to{ transform:rotate(360deg); } }
  #vbook-controls{
    display:none; justify-content:center; align-items:center; gap:18px;
    margin-top:16px; user-select:none;
  }
  #vbook-controls button{
    width:44px; height:44px; border-radius:50%; border:1px solid #c9c9c9;
    background:#fff; font-size:24px; line-height:1; cursor:pointer; color:#333;
  }
  #vbook-controls button:hover{ background:#eef0ea; }
  #vbook-counter{ min-width:80px; text-align:center; font-size:15px; color:#444; }
  .stf__parent{ box-shadow:0 10px 35px rgba(0,0,0,.15); }
</style>
</head>
<body>

<div id="vbook-wrap">
  <div id="vbook-loader">
    <div class="vbook-spinner"></div>
    <div>Загрузка проекта…</div>
  </div>
  <div id="vbook"></div>
  <div id="vbook-controls">
    <button id="vbook-prev" aria-label="Назад">&#8249;</button>
    <span id="vbook-counter">1 / 1</span>
    <button id="vbook-next" aria-label="Вперёд">&#8250;</button>
    <button id="vbook-full" aria-label="Во весь экран" title="Во весь экран">&#x26F6;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
  /* ===== НАСТРОЙКИ ===== */
  var PDF_FILE     = 'veter.pdf';  // имя PDF в репозитории
  var RENDER_WIDTH = 1600;         // качество страницы (больше = чётче, но медленнее)
  /* ===================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var bookEl   = document.getElementById('vbook');
  var loader   = document.getElementById('vbook-loader');
  var controls = document.getElementById('vbook-controls');
  var counter  = document.getElementById('vbook-counter');
  var wrap     = document.getElementById('vbook-wrap');

  pdfjsLib.getDocument({
    url: PDF_FILE,
    disableAutoFetch: true,   // не качать весь файл заранее
    disableStream: true
  }).promise.then(async function(pdf){

    var N = pdf.numPages;
    var first = await pdf.getPage(1);
    var v1 = first.getViewport({ scale: 1 });
    var RATIO = v1.height / v1.width;

    // пустые страницы-заготовки
    var canvases = [];
    for (var i = 0; i < N; i++){
      var div = document.createElement('div');
      div.className = 'vbook-page';
      var c = document.createElement('canvas');
      div.appendChild(c);
      bookEl.appendChild(div);
      canvases.push(c);
    }

    var done = {};
    async function renderPage(idx){
      var page = await pdf.getPage(idx + 1);
      var base = page.getViewport({ scale: 1 });
      var vp = page.getViewport({ scale: RENDER_WIDTH / base.width });
      var c = canvases[idx];
      c.width = vp.width;
      c.height = vp.height;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      page.cleanup();
    }

    // очередь отрисовки: сначала открытая страница, потом соседние
    var queue = [], busy = false;
    async function run(){
      if (busy) return;
      busy = true;
      while (queue.length){
        var idx = queue.shift();
        try { await renderPage(idx); }
        catch(e){ console.error(e); done[idx] = false; }
      }
      busy = false;
    }
    function loadAround(idx){
      queue.forEach(function(q){ done[q] = false; });
      queue = [];
      [idx, idx + 1, idx - 1, idx + 2, idx + 3, idx + 4, idx + 5, idx - 2].forEach(function(j){
        if (j >= 0 && j < N && !done[j]){ done[j] = true; queue.push(j); }
      });
      run();
    }

    // сначала обложка, потом показываем книгу
    done[0] = true;
    await renderPage(0);

    var w = 650;
    var pageFlip = new St.PageFlip(bookEl, {
      width: w,
      height: Math.round(w * RATIO),
      size: 'stretch',
      minWidth: 280,
      maxWidth: 1100,
      minHeight: Math.round(280 * RATIO),
      maxHeight: Math.round(1100 * RATIO),
      showCover: true,
      usePortrait: true,
      mobileScrollSupport: false,
      maxShadowOpacity: 0.4,
      flippingTime: 800
    });
    pageFlip.loadFromHTML(document.querySelectorAll('#vbook .vbook-page'));

    loader.style.display = 'none';
    controls.style.display = 'flex';

    function update(){
      var idx = pageFlip.getCurrentPageIndex();
      counter.textContent = (idx + 1) + ' / ' + pageFlip.getPageCount();
      loadAround(idx);
    }
    update();
    pageFlip.on('flip', update);
    pageFlip.on('changeOrientation', update);

    document.getElementById('vbook-prev').onclick = function(){ pageFlip.flipPrev(); };
    document.getElementById('vbook-next').onclick = function(){ pageFlip.flipNext(); };

    document.addEventListener('keydown', function(e){
      if (e.key === 'ArrowLeft')  pageFlip.flipPrev();
      if (e.key === 'ArrowRight') pageFlip.flipNext();
    });

    document.getElementById('vbook-full').onclick = function(){
      if (!document.fullscreenElement){
        (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    };

  }).catch(function(err){
    console.error(err);
    loader.innerHTML = 'Не удалось открыть файл «' + PDF_FILE +
      '». Проверьте, что он лежит рядом с index.html и имя совпадает (с учётом регистра).';
  });
})();
</script>
</body>
</html>
