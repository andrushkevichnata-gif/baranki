<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ландшафтный проект «Ветер»</title>
<style>
  html, body{ margin:0; padding:0; background:transparent; font-family:Arial, sans-serif; }
  #vbook-wrap{ max-width:1400px; margin:0 auto; padding:15px 10px; box-sizing:border-box; }
  #vbook-wrap:fullscreen{
    max-width:none; width:100vw; height:100vh; background:#f3f1ec;
    display:flex; flex-direction:column; justify-content:center; padding:20px;
  }
  #vbook{ margin:0 auto; }
  .vbook-page{ background:#f4f4f2; overflow:hidden; }
  .vbook-page canvas{ width:100%; height:100%; display:block; }
  #vbook-loader{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:80px 0; color:#555; font-size:16px; text-align:center;
  }
  .vbook-spinner{
    width:42px; height:42px; border:3px solid #ddd; border-top-color:#7a8b6f;
    border-radius:50%; animation:vbookspin 1s linear infinite;
  }
  @keyframes vbookspin{ to{ transform:rotate(360deg); } }
  #vbook-controls{
    display:none; justify-content:center; align-items:center; gap:18px;
    margin-top:16px; user-select:none;
  }
  #vbook-controls button{
    width:44px; height:44px; border-radius:50%; border:1px solid #c9c9c9;
    background:#fff; font-size:22px; line-height:1; cursor:pointer; color:#333;
  }
  #vbook-controls button:hover{ background:#eef0ea; }
  #vbook-counter{ min-width:80px; text-align:center; font-size:15px; color:#444; }
  .stf__parent{ box-shadow:0 10px 35px rgba(0,0,0,.15); }
</style>
</head>
<body>

<div id="vbook-wrap">
  <div id="vbook-loader">
    <div class="vbook-spinner"></div>
    <div>Загрузка проекта…</div>
  </div>
  <div id="vbook"></div>
  <div id="vbook-controls">
    <button id="vbook-prev" aria-label="Назад">&#8249;</button>
    <span id="vbook-counter">1 / 1</span>
    <button id="vbook-next" aria-label="Вперёд">&#8250;</button>
    <button id="vbook-sound" aria-label="Звук" title="Звук">&#128266;</button>
    <button id="vbook-full" aria-label="Во весь экран" title="Во весь экран">&#x26F6;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
  /* ===== НАСТРОЙКИ ===== */
  var PDF_FILE     = 'veter.pdf';  // имя PDF в репозитории
  var RENDER_WIDTH = 1600;         // качество страницы
  var SOUND_ON     = true;         // звук включён по умолчанию
  var VOLUME       = 0.35;         // громкость шелеста (0.1 – тихо, 0.6 – громко)
  /* ===================== */

  /* ---------- ШЕЛЕСТ СТРАНИЦЫ ---------- */
  var audioCtx = null;
  var soundOn = SOUND_ON;

  function getCtx(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  // браузеры разрешают звук только после действия пользователя
  ['pointerdown', 'touchstart', 'keydown'].forEach(function(ev){
    document.addEventListener(ev, getCtx, { passive: true });
  });

  function playRustle(){
    if (!soundOn) return;
    var ctx = getCtx();
    if (!ctx) return;

    var now = ctx.currentTime;
    var dur = 0.45 + Math.random() * 0.15;           // каждый раз немного разная длина
    var len = Math.floor(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++){
      // «шуршащий» шум с потрескиванием бумаги
      d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.25 ? 1 : 0.35);
    }

    var src = ctx.createBufferSource();
    src.buffer = buf;

    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 500;

    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 0.7;
    var f = 1100 + Math.random() * 500;
    bp.frequency.setValueAtTime(f, now);
    bp.frequency.exponentialRampToValueAtTime(f * 3.2, now + dur * 0.55);
    bp.frequency.exponentialRampToValueAtTime(f * 1.4, now + dur);

    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(VOLUME,       now + 0.05);
    g.gain.exponentialRampToValueAtTime(VOLUME * 0.45, now + dur * 0.45);
    g.gain.exponentialRampToValueAtTime(VOLUME * 0.9,  now + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001,        now + dur);

    src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(now);
    src.stop(now + dur);
  }

  var soundBtn = document.getElementById('vbook-sound');
  function updateSoundBtn(){ soundBtn.innerHTML = soundOn ? '&#128266;' : '&#128263;'; }
  updateSoundBtn();
  soundBtn.onclick = function(){ soundOn = !soundOn; updateSoundBtn(); };
  /* ------------------------------------- */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var bookEl   = document.getElementById('vbook');
  var loader   = document.getElementById('vbook-loader');
  var controls = document.getElementById('vbook-controls');
  var counter  = document.getElementById('vbook-counter');
  var wrap     = document.getElementById('vbook-wrap');

  pdfjsLib.getDocument({
    url: PDF_FILE,
    disableAutoFetch: true,
    disableStream: true
  }).promise.then(async function(pdf){

    var N = pdf.numPages;
    var first = await pdf.getPage(1);
    var v1 = first.getViewport({ scale: 1 });
    var RATIO = v1.height / v1.width;

    var canvases = [];
    for (var i = 0; i < N; i++){
      var div = document.createElement('div');
      div.className = 'vbook-page';
      var c = document.createElement('canvas');
      div.appendChild(c);
      bookEl.appendChild(div);
      canvases.push(c);
    }

    var done = {};
